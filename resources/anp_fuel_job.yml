resources:
  jobs:
    anp_fuel_pipeline:
      name: anp_fuel_pipeline
      # No schedule: run manually with `databricks bundle run anp_fuel_pipeline -t dev`.
      # No cluster definitions: every task runs on serverless jobs compute.
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/00_setup.sql
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ingest
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../src/01_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              years: ${var.years}

        - task_key: bronze
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../src/02_bronze.py
            base_parameters:
              catalog: ${var.catalog}

        # Unit tests for the silver rules; runs alongside ingest/bronze and gates silver.
        - task_key: test
          notebook_task:
            notebook_path: ../tests/run_tests.py

        - task_key: silver
          depends_on:
            - task_key: bronze
            - task_key: test
          notebook_task:
            notebook_path: ../src/03_silver.py
            base_parameters:
              catalog: ${var.catalog}
