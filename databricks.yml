# Databricks Asset Bundle for the ANP fuel price pipeline.
bundle:
  name: anp_fuel_pipeline

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds all pipeline schemas.
    default: anp_fuel
  start_year:
    description: First ANP survey year to ingest; ingestion always runs up to the current year.
    default: "2023"
  ratio_threshold:
    description: Ethanol pays off when its price divided by the gasoline price is below this ratio.
    default: "0.70"
  spike_threshold:
    description: Week-over-week state price increase (%) flagged as a spike in the weekly digest.
    default: "5"
  min_stations:
    description: Minimum stations surveyed in a state and week for it to enter the digest rankings.
    default: "10"

targets:
  dev:
    default: true
    mode: development
    # Credentials come from the matching profile in ~/.databrickscfg.
    workspace:
      host: https://dbc-8c6f524f-f86f.cloud.databricks.com
